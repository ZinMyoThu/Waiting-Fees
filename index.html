<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Waiting Fees" />
    <link rel="apple-touch-icon" href="/waiting-fees-app-icon-180.png">
    <link rel="manifest" href="/manifest.json">

    <title>Waiting Tracker</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --accent-blue: #0A84FF;
            --accent-red: #FF453A;
            --accent-green: #32D74B;
            --text-main: #FFFFFF;
            --text-sub: #8E8E93;
            --input-bg: #2C2C2E;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 92%;
            max-width: 340px;
            padding: 24px;
            background: var(--card-bg);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h3 { margin: 0 0 20px 0; font-size: 19px; color: var(--accent-blue); text-align: center; }

        .input-group { width: 100%; margin-bottom: 15px; }

        label {
            font-size: 11px;
            color: var(--text-sub);
            margin: 0 0 6px 5px;
            display: block;
            text-transform: uppercase;
        }

        input[type="time"] {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid #3A3A3C;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 18px;
            outline: none;
            display: block;
            -webkit-appearance: none;
        }

        .timer-display {
            font-size: 48px;
            font-weight: 200;
            margin: 20px 0;
            text-align: center;
            font-variant-numeric: tabular-nums;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 12px 0;
        }

        button {
            width: 100%;
            padding: 17px;
            border-radius: 16px;
            border: none;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-start { background-color: var(--accent-blue); color: white; }
        .btn-stop { background-color: var(--accent-red); color: white; }
        .btn-reset { background-color: transparent; color: var(--text-sub); border: 1px solid #333; }

        .result-card {
            margin-top: 15px;
            padding: 18px;
            background: rgba(10, 132, 255, 0.12);
            border-radius: 20px;
            display: none;
            border: 1px solid rgba(10, 132, 255, 0.2);
        }

        .detail-section {
            margin-top: 12px;
            text-align: left;
            font-size: 13px;
            border-top: 1px solid #444;
            padding-top: 10px;
            display: none;
        }

        .detail-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .toggle-detail { color: var(--accent-blue); font-size: 13px; text-decoration: underline; margin: 10px 0; display: inline-block; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h3>Waiting Tracker</h3>

    <div class="input-group">
        <label>စတင်ချိန် (Start Time)</label>
        <input type="time" id="manualStartTime" oninput="manualUpdate()">
    </div>

    <div class="input-group">
        <label>ပြီးဆုံးချိန် (End Time)</label>
        <input type="time" id="manualEndTime" oninput="manualUpdate()">
    </div>

    <div class="timer-display" id="display">00:00:00</div>
    
    <button id="mainBtn" class="btn-start" onclick="toggleTracker()">Start Tracking</button>
    
    <div class="result-card" id="resultCard">
        <div id="totalCost" style="font-size: 32px; font-weight: 700; color: var(--accent-blue); text-align: center;">0 ကျပ်</div>
        <center><span class="toggle-detail" id="toggleBtn" onclick="toggleDetail()">See Detail</span></center>
        <div class="detail-section" id="detailBox">
            <div class="detail-row"><span>စုစုပေါင်းကြာချိန်:</span> <span id="fullDuration"></span></div>
            <div class="detail-row" style="color: var(--accent-green);"><span>Free အချိန် (၅ မိနစ်):</span> <span id="freeRange"></span></div>
            <div class="detail-row" style="color: var(--accent-red);"><span>Paid အချိန်:</span> <span id="paidRange"></span></div>
            <div class="detail-row"><span>တွက်ချက်သည့် မိနစ်:</span> <span id="chargedMins"></span></div>
        </div>
    </div>

    <button class="btn-reset" onclick="resetAll()">Reset Session</button>
</div>

<script>
    let timerInterval;
    let isTracking = false;
    let virtualStartTime; 

    window.onload = () => {
        // အစမှာ End Time ကို လက်ရှိအချိန်ပြထားမယ်
        const now = new Date();
        document.getElementById('manualEndTime').value = formatToHHMM(now);
    };

    function formatToHHMM(date) {
        return date.getHours().toString().padStart(2, '0') + ":" + 
               date.getMinutes().toString().padStart(2, '0');
    }

    function toggleTracker() {
        const startInput = document.getElementById('manualStartTime');
        const now = new Date();

        if (!isTracking) {
            // Start Tracking Logic
            if (!startInput.value) {
                // အချိန်မရိုက်ထားရင် အခုအချိန်ကနေ စမယ် (စက္ကန့်ကို ၀ ညှိမယ်)
                const sDate = new Date();
                sDate.setSeconds(0, 0);
                startInput.value = formatToHHMM(sDate);
                virtualStartTime = sDate;
            } else {
                // Manual ရိုက်ထားရင် အဲ့ဒီအချိန်ကိုယူမယ်
                const [h, m] = startInput.value.split(':');
                virtualStartTime = new Date();
                virtualStartTime.setHours(h, m, 0, 0);
                if (virtualStartTime > now) virtualStartTime.setDate(virtualStartTime.getDate() - 1);
            }

            isTracking = true;
            document.getElementById('mainBtn').innerText = "Stop & Calculate";
            document.getElementById('mainBtn').className = "btn-stop";
            document.getElementById('resultCard').style.display = 'none';
            
            timerInterval = setInterval(updateDisplay, 1000);
            updateDisplay();
        } else {
            stopTracker();
        }
    }

    // Manual အချိန်ပြင်လိုက်ရင် Timer ကို ချက်ချင်း Update လုပ်ပေးဖို့
    function manualUpdate() {
        if (isTracking) {
            const startInput = document.getElementById('manualStartTime');
            const [h, m] = startInput.value.split(':');
            virtualStartTime = new Date();
            virtualStartTime.setHours(h, m, 0, 0);
            if (virtualStartTime > new Date()) virtualStartTime.setDate(virtualStartTime.getDate() - 1);
            updateDisplay();
        }
    }

    function updateDisplay() {
        const now = new Date();
        const diffMs = now - virtualStartTime;
        
        if (diffMs < 0) {
            document.getElementById('display').innerText = "00:00:00";
        } else {
            const h = String(Math.floor(diffMs / 3600000)).padStart(2, '0');
            const m = String(Math.floor((diffMs % 3600000) / 60000)).padStart(2, '0');
            const s = String(Math.floor((diffMs % 60000) / 1000)).padStart(2, '0');
            document.getElementById('display').innerText = `${h}:${m}:${s}`;
        }
        
        // Timer ပြေးနေတုန်း End Time ကို auto လိုက်ပြင်ပေးမယ်
        document.getElementById('manualEndTime').value = formatToHHMM(now);
    }

    function stopTracker() {
        clearInterval(timerInterval);
        isTracking = false;
        
        // တွက်ချက်မှုအတွက် Input ထဲက နာရီ/မိနစ် အတိအကျကိုပဲ ယူမယ်
        const startVal = document.getElementById('manualStartTime').value;
        const endVal = document.getElementById('manualEndTime').value;
        
        const [sh, sm] = startVal.split(':');
        const [eh, em] = endVal.split(':');

        let finalStart = new Date();
        finalStart.setHours(sh, sm, 0, 0);
        
        let finalEnd = new Date();
        finalEnd.setHours(eh, em, 0, 0);

        if (finalEnd < finalStart) finalEnd.setDate(finalEnd.getDate() + 1);

        const diffMs = finalEnd - finalStart;
        const totalMins = diffMs / 60000;

        let cost = 0;
        let chargedUnits = 0;
        if (totalMins > 5) {
            chargedUnits = Math.ceil((totalMins - 5) / 5);
            cost = chargedUnits * 500;
        }

        // UI Update
        document.getElementById('totalCost').innerText = cost.toLocaleString() + " ကျပ်";
        document.getElementById('fullDuration').innerText = `${Math.floor(totalMins)} မိနစ်`;
        
        const fEnd = new Date(finalStart.getTime() + 5 * 60000);
        const fmt = (d) => d.toTimeString().split(' ')[0].substring(0,5);
        document.getElementById('freeRange').innerText = `${fmt(finalStart)} - ${fmt(fEnd)}`;
        
        if (totalMins > 5) {
            document.getElementById('paidRange').innerText = `${fmt(fEnd)} - ${fmt(finalEnd)}`;
            document.getElementById('chargedMins').innerText = (chargedUnits * 5) + " မိနစ်စာ";
        } else {
            document.getElementById('paidRange').innerText = "မရှိပါ";
            document.getElementById('chargedMins').innerText = "၀ မိနစ်";
        }

        document.getElementById('resultCard').style.display = 'block';
        document.getElementById('mainBtn').innerText = "Restart Tracking";
        document.getElementById('mainBtn').className = "btn-start";
    }

    function toggleDetail() {
        const box = document.getElementById('detailBox');
        const isHidden = box.style.display === "none" || box.style.display === "";
        box.style.display = isHidden ? "block" : "none";
        document.getElementById('toggleBtn').innerText = isHidden ? "Hide Detail" : "See Detail";
    }

    function resetAll() { location.reload(); }
</script>

</body>
</html>
